name: Steam build

# Builds the Steam version of the app as a folder to upload with SteamPipe.
# Run it by hand (Actions -> Steam build -> Run workflow). It never makes a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Add the Steam API
        run: npm install --no-save steamworks.js@0.4
      - name: Switch to the Steam version
        run: node scripts/steam-build.js
      - name: Build
        run: npx electron-builder --win dir --x64 --publish never
      - name: Add steam_appid.txt for testing outside Steam
        shell: bash
        run: node -e "process.stdout.write(String(require('./package.json').bitty.steam.appId))" > dist/win-unpacked/steam_appid.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bitty-Buddies-Steam
          path: dist/win-unpacked
          retention-days: 30
